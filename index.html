<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我看过的影视 · 2008–2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{ --bg:#f6f5f1; --card:#fff; --ink:#20201d; --muted:#8d8a80; --line:#e7e4dc; --accent:#2f6f4f; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:48px 24px 64px}
  header h1{margin:0 0 6px;font-size:30px;font-weight:700;letter-spacing:-.01em}
  header .sub{color:var(--muted);font-size:14px}

  .filters{display:flex;flex-direction:column;align-items:stretch;gap:0;margin:24px 0 4px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
  .filters .lab{color:var(--muted);font-size:13px}
  .filters select{font:inherit;font-size:14px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;
    background:#fff;color:var(--ink);cursor:pointer}
  .filters .sep{color:var(--muted)}
  .presets{margin-left:auto;display:flex;gap:6px}
  .presets button{font:inherit;font-size:13px;padding:5px 12px;border:1px solid var(--line);border-radius:20px;
    background:#fff;color:var(--muted);cursor:pointer}
  .presets button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .rangeTxt{color:var(--accent);font-size:13px;font-weight:600}
  .hint{color:var(--muted);font-size:12.5px;margin:10px 2px 0}
  .hint b{color:var(--accent);font-weight:600}
  .frow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;width:100%}
  .frow .lab{min-width:34px;flex:none}
  .frow + .frow{margin-top:9px;padding-top:10px;border-top:1px dashed var(--line)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font:inherit;font-size:12.5px;padding:3px 10px;border:1px solid var(--line);border-radius:14px;
    background:#fff;color:var(--muted);cursor:pointer;line-height:1.5}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .mini{font:inherit;font-size:12px;border:none;background:none;color:var(--muted);cursor:pointer;
    text-decoration:underline;padding:2px 4px}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0 6px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .kpi .n{font-size:26px;font-weight:700;letter-spacing:-.02em}
  .kpi .n small{font-size:14px;font-weight:500;color:var(--muted);margin-left:3px}
  .kpi .l{color:var(--muted);font-size:12.5px;margin-top:2px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 18px 12px;min-width:0}
  .card.wide{grid-column:1 / -1}
  .card h2{margin:0 0 2px;font-size:15px;font-weight:600}
  .card p.note{margin:0 0 12px;color:var(--muted);font-size:12.5px}
  .cv{position:relative;height:280px;cursor:pointer}
  .cv.tall{height:320px}

  .modal{position:fixed;inset:0;background:rgba(28,26,22,.45);display:none;z-index:99;
    align-items:center;justify-content:center;padding:24px}
  .modal.on{display:flex}
  .modal-box{background:#fff;border-radius:14px;width:100%;max-width:660px;max-height:82vh;display:flex;
    flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.25);overflow:hidden}
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;
    border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
  .modal-head button{font:inherit;font-size:22px;line-height:1;border:none;background:none;color:var(--muted);
    cursor:pointer;padding:0 4px}
  .modal-body{overflow:auto;padding:6px 8px 12px}
  .mrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 12px;
    border-radius:8px;text-decoration:none;color:inherit;font-size:13.5px}
  .mrow:hover{background:#f4f2ec}
  .mrow .rt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mrow .rs{color:#c9a227;white-space:nowrap;font-size:12.5px;letter-spacing:1px}
  .mrow .rd{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:12.5px}
  .mempty{color:var(--muted);padding:28px;text-align:center;font-size:13.5px}

  footer{margin-top:34px;color:var(--muted);font-size:12.5px;line-height:1.8;border-top:1px solid var(--line);padding-top:16px}
  @media(max-width:760px){ .kpis{grid-template-columns:1fr 1fr} .grid{grid-template-columns:1fr} .wrap{padding:32px 16px 48px}
    .presets{margin-left:0} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>我看过的影视</h1>
    <div class="sub">2008 – 2026 · 数据来自豆瓣标记日期与你的评分 · 导出于 2026-10-06</div>
  </header>

  <section class="filters">
    <div class="frow">
      <span class="lab">时间</span>
      <select id="yFrom"></select>
      <span class="sep">—</span>
      <select id="yTo"></select>
      <span class="rangeTxt" id="rangeTxt"></span>
      <div class="presets">
        <button data-p="all" class="on">全部</button>
        <button data-p="10">近 10 年</button>
        <button data-p="5">近 5 年</button>
      </div>
    </div>
    <div class="frow">
      <span class="lab">评分</span>
      <div class="chips" id="starChips"></div>
      <button type="button" class="mini" data-all="star">全选</button>
      <button type="button" class="mini" data-none="star">清空</button>
    </div>
    <div class="frow">
      <span class="lab">类型</span>
      <div class="chips" id="typeChips"></div>
      <button type="button" class="mini" data-all="type">全选</button>
      <button type="button" class="mini" data-none="type">清空</button>
    </div>
  </section>
  <p class="hint">点图上的<b>柱子 / 扇形 / 折线上的点 / 色块</b>,可以展开那一部分的完整名单。</p>

  <section class="kpis" id="kpis"></section>

  <main class="grid">
    <figure class="card wide" style="margin:0">
      <h2>每年标记数量</h2>
      <p class="note">柱子是当年数量,折线是所选范围内的累计</p>
      <div class="cv tall"><canvas id="cYear"></canvas></div>
    </figure>

    <figure class="card" style="margin:0">
      <h2>评分分布</h2>
      <p class="note">你给每部打的星数</p>
      <div class="cv"><canvas id="cStars"></canvas></div>
    </figure>

    <figure class="card" style="margin:0">
      <h2>类型分布</h2>
      <p class="note">按你给每部打的标签归类(随筛选变化,范围内没有的类型不显示)</p>
      <div class="cv"><canvas id="cType"></canvas></div>
    </figure>

    <figure class="card" style="margin:0">
      <h2>每年平均评分</h2>
      <p class="note">看看口味是变宽容还是变挑剔</p>
      <div class="cv"><canvas id="cAvg"></canvas></div>
    </figure>

    <figure class="card" style="margin:0">
      <h2>评分 × 类型</h2>
      <p class="note">每类里各星级的占比(100% 堆叠;范围内没有的类型不显示)</p>
      <div class="cv"><canvas id="cTypeStar"></canvas></div>
    </figure>

    <figure class="card wide" style="margin:0">
      <h2>各类型占比的逐年变化</h2>
      <p class="note">每年内部按 100% 归一,看口味怎么漂移(前 8 类单列,其余归入"其他")</p>
      <div class="cv tall"><canvas id="cYearType"></canvas></div>
    </figure>

    <figure class="card" style="margin:0">
      <h2>月份分布</h2>
      <p class="note">你习惯在哪个月看片子</p>
      <div class="cv"><canvas id="cMonth"></canvas></div>
    </figure>

    <figure class="card" style="margin:0">
      <h2>星期分布</h2>
      <p class="note">一周里哪天标记得最多</p>
      <div class="cv"><canvas id="cWeek"></canvas></div>
    </figure>
  </main>

  <footer id="foot"></footer>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head"><span id="modalTitle"></span><button id="modalClose" type="button" title="关闭">×</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

// 每条记录: [年偏移, 月, 星期0-6, 类型下标, 星数, 有无短评, 豆瓣ID, 片名, 标记日期]
const REC = DATA.records;
const TYPES = DATA.types;
const Y0 = 2008;
const YEARS = Array.from({length:19},(_,i)=>Y0+i);

const PALETTE = ['#5b7c99','#c0713f','#5e8c61','#8f6aa8','#c9a227','#3f8f8f','#b85c6e',
                 '#7d8c4f','#6f6bb0','#2f9e8f','#a8703f','#57607a','#8c8c5f','#4f7fa8','#9b9b9b'];
const WK = ['周一','周二','周三','周四','周五','周六','周日'];
const MO = Array.from({length:12},(_,i)=>(i+1)+'月');
const STAR_LABELS = ['★1','★2','★3','★4','★5','未评分'];
const STAR_BUCKET = [1,2,3,4,5,0];                 // 标签顺序 → 数据下标(0 是未评分)
const STAR_COLORS = ['#c0713f','#c78c45','#c9a227','#a8a83f','#5e8c61','#d8d5cc'];

Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
Chart.defaults.font.size = 12;
Chart.defaults.color = '#6f6c63';
const GRID = {grid:{color:'#efede7'}};

let charts = {};
function make(id, cfg){
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(document.getElementById(id), cfg);
}
function starText(n){ return n ? '★'.repeat(n) : '未评分'; }

// ---------- 名单弹层 ----------
let currentSel = [];
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');
function closeModal(){ modal.classList.remove('on'); }
document.getElementById('modalClose').addEventListener('click', closeModal);
modal.addEventListener('click', function(e){ if (e.target === modal) closeModal(); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal(); });

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function showList(heading, pred){
  const rows = currentSel.filter(pred).slice().sort(function(x,y){
    return String(y[8]||'').localeCompare(String(x[8]||''));
  });
  modalTitle.textContent = heading + ' · ' + rows.length + ' 部';
  modalBody.innerHTML = rows.length ? rows.map(function(r){
    return '<a class="mrow" href="https://movie.douban.com/subject/'+r[6]+'/" target="_blank" rel="noopener">'+
      '<span class="rt">'+esc(r[7])+'</span>'+
      '<span class="rs">'+starText(r[4])+'</span>'+
      '<span class="rd">'+esc(r[8])+'</span></a>';
  }).join('') : '<div class="mempty">这个范围内没有影片</div>';
  modalBody.scrollTop = 0;
  modal.classList.add('on');
}

// ---------- 筛选控件 ----------
const yFrom = document.getElementById('yFrom');
const yTo   = document.getElementById('yTo');
YEARS.forEach(function(y,i){
  yFrom.insertAdjacentHTML('beforeend','<option value="'+i+'">'+y+' 年</option>');
  yTo.insertAdjacentHTML('beforeend','<option value="'+i+'">'+y+' 年</option>');
});
yFrom.value = 0; yTo.value = YEARS.length-1;

const starOn = [true,true,true,true,true,true];       // 下标 = 星数(0 = 未评分)
const typeOn = TYPES.map(function(){ return true; });
const starChipEls = [], typeChipEls = [];
(function buildChips(){
  const sc = document.getElementById('starChips');
  STAR_LABELS.forEach(function(name,k){
    const si = STAR_BUCKET[k];
    const el = document.createElement('button');
    el.type = 'button'; el.className = 'chip on'; el.textContent = name; el.dataset.si = si;
    el.addEventListener('click', function(){
      starOn[si] = !starOn[si]; el.classList.toggle('on', starOn[si]); render();
    });
    sc.appendChild(el); starChipEls.push(el);
  });
  const tc = document.getElementById('typeChips');
  TYPES.forEach(function(t,ti){
    const el = document.createElement('button');
    el.type = 'button'; el.className = 'chip on'; el.textContent = t; el.dataset.ti = ti;
    el.addEventListener('click', function(){
      typeOn[ti] = !typeOn[ti]; el.classList.toggle('on', typeOn[ti]); render();
    });
    tc.appendChild(el); typeChipEls.push(el);
  });
})();
document.querySelectorAll('[data-all],[data-none]').forEach(function(b){
  b.addEventListener('click', function(){
    const which = b.dataset.all || b.dataset.none;
    const val = !!b.dataset.all;
    const arr = which === 'star' ? starOn : typeOn;
    for (let i = 0; i < arr.length; i++) arr[i] = val;
    (which === 'star' ? starChipEls : typeChipEls).forEach(function(el){ el.classList.toggle('on', val); });
    render();
  });
});

function setPreset(p){
  if (p === 'all'){ yFrom.value = 0; yTo.value = YEARS.length-1; }
  else { yTo.value = YEARS.length-1; yFrom.value = Math.max(0, YEARS.length - Number(p)); }
  document.querySelectorAll('.presets button').forEach(function(b){ b.classList.toggle('on', b.dataset.p === p); });
  render();
}
document.querySelectorAll('.presets button').forEach(function(b){
  b.addEventListener('click', function(){ setPreset(b.dataset.p); });
});
function onManual(){
  if (+yFrom.value > +yTo.value) yTo.value = yFrom.value;
  document.querySelectorAll('.presets button').forEach(function(b){ b.classList.remove('on'); });
  render();
}
yFrom.addEventListener('change', function(){ if (+yTo.value < +yFrom.value) yTo.value = yFrom.value; onManual(); });
yTo.addEventListener('change', function(){ if (+yFrom.value > +yTo.value) yFrom.value = yTo.value; onManual(); });

// ---------- 主渲染 ----------
function render(){
  const a = +yFrom.value, b = +yTo.value;
  const yrs = [];
  for (let i = a; i <= b; i++) yrs.push(i);

  const sel = REC.filter(function(r){
    return r[0] >= a && r[0] <= b && starOn[r[4]] && typeOn[r[3]];
  });
  currentSel = sel;

  const byYear = yrs.map(function(i){ return sel.filter(function(r){ return r[0]===i; }).length; });
  const byMonth = Array(12).fill(0), byWeek = Array(7).fill(0);
  const typeCount = TYPES.map(function(){ return 0; });
  const starCount = [0,0,0,0,0,0];
  const typeStar = TYPES.map(function(){ return [0,0,0,0,0,0]; });
  const yearType = yrs.map(function(){ return TYPES.map(function(){ return 0; }); });
  let sum = 0, rated = 0, comments = 0;

  sel.forEach(function(r){
    const yi = r[0], m = r[1], wd = r[2], ti = r[3], st = r[4], cm = r[5];
    byMonth[m-1]++; byWeek[wd]++;
    typeCount[ti]++; typeStar[ti][st]++;
    starCount[st]++; if (st>0){ sum += st; rated++; }
    if (cm) comments++;
    yearType[yi - a][ti]++;
  });

  const avgYear = yrs.map(function(y){
    let s = 0, n = 0;
    sel.forEach(function(r){ if (r[0] === y && r[4] > 0){ s += r[4]; n++; } });
    return n ? +(s/n).toFixed(2) : null;
  });

  let cum = 0; const cumulative = byYear.map(function(v){ cum += v; return cum; });
  const labels = yrs.map(function(i){ return YEARS[i]; });

  document.getElementById('rangeTxt').textContent = YEARS[a] + '–' + YEARS[b] + ' · ' + sel.length + ' 部';

  // ---- KPI ----
  const avg = rated ? (sum/rated) : 0;
  const five = starCount[5];
  document.getElementById('kpis').innerHTML = [
    ['影片数', sel.length, '部'],
    ['平均评分', avg.toFixed(2), '★'],
    ['打过五星', five, (five*100/Math.max(1,sel.length)).toFixed(1)+'%'],
    ['写过短评', comments, (comments*100/Math.max(1,sel.length)).toFixed(0)+'%']
  ].map(function(k){
    return '<div class="kpi"><div class="n">'+k[1]+'<small>'+k[2]+'</small></div><div class="l">'+k[0]+'</div></div>';
  }).join('');

  // ---- 年度 + 累计 ----
  make('cYear', {
    data:{ labels: labels, datasets:[
      {type:'bar', label:'当年数量', data:byYear, backgroundColor:'#5b7c99', borderRadius:3, yAxisID:'y'},
      {type:'line', label:'累计', data:cumulative, borderColor:'#c0713f', backgroundColor:'#c0713f',
       borderWidth:2, pointRadius:0, tension:.25, yAxisID:'y1'}
    ]},
    options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
      onClick:function(e,els){
        if (!els.length || els[0].datasetIndex !== 0) return;
        const i = els[0].index;
        showList(YEARS[yrs[i]] + ' 年', function(r){ return r[0] === yrs[i]; });
      },
      scales:{ y:{position:'left',beginAtZero:true,...GRID},
               y1:{position:'right',beginAtZero:true,grid:{drawOnChartArea:false}},
               x:{grid:{display:false}} },
      plugins:{ legend:{labels:{boxWidth:11,boxHeight:11,usePointStyle:true}} } }
  });

  // ---- 评分分布 ----
  make('cStars', {
    type:'bar',
    data:{ labels:STAR_LABELS,
      datasets:[{ data:[starCount[1],starCount[2],starCount[3],starCount[4],starCount[5],starCount[0]],
        backgroundColor:STAR_COLORS, borderRadius:4 }] },
    options:{ responsive:true, maintainAspectRatio:false,
      onClick:function(e,els){
        if (!els.length) return;
        const si = STAR_BUCKET[els[0].index];
        showList(si ? si + ' 星' : '未评分', function(r){ return r[4] === si; });
      },
      plugins:{ legend:{display:false},
        tooltip:{callbacks:{label:function(c){ return ' '+c.parsed.y+' 部'; }}} },
      scales:{ y:{beginAtZero:true,...GRID}, x:{grid:{display:false}} } }
  });

  // ---- 类型分布(只显示当前范围内出现过的类型) ----
  const presentIdx = TYPES.map(function(_,i){ return i; }).filter(function(i){ return typeCount[i] > 0; });
  make('cType', {
    type:'doughnut',
    data:{ labels:presentIdx.map(function(i){ return TYPES[i]; }),
      datasets:[{ data:presentIdx.map(function(i){ return typeCount[i]; }),
        backgroundColor:presentIdx.map(function(i){ return PALETTE[i % PALETTE.length]; }),
        borderColor:'#fff', borderWidth:2 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'58%',
      onClick:function(e,els){
        if (!els.length) return;
        const ti = presentIdx[els[0].index];
        showList(TYPES[ti], function(r){ return r[3] === ti; });
      },
      plugins:{ legend:{position:'right',labels:{boxWidth:11,boxHeight:11,padding:8}},
        tooltip:{callbacks:{label:function(c){ return ' '+c.label+'  '+c.parsed+' 部'; }}} } }
  });

  // ---- 每年平均评分 ----
  make('cAvg', {
    type:'line',
    data:{ labels:labels, datasets:[{ data:avgYear, borderColor:'#8f6aa8', backgroundColor:'rgba(143,106,168,.12)',
      borderWidth:2, pointRadius:3, pointBackgroundColor:'#8f6aa8', tension:.3, fill:true, spanGaps:true }] },
    options:{ responsive:true, maintainAspectRatio:false,
      onClick:function(e,els){
        if (!els.length) return;
        const i = els[0].index;
        showList(YEARS[yrs[i]] + ' 年', function(r){ return r[0] === yrs[i]; });
      },
      plugins:{ legend:{display:false},
        tooltip:{callbacks:{label:function(c){ return ' 平均 '+(c.parsed.y==null?'—':c.parsed.y)+' ★'; }}}},
      scales:{ y:{suggestedMin:1,suggestedMax:5,ticks:{stepSize:1},...GRID}, x:{grid:{display:false}} } }
  });

  // ---- 评分 × 类型(100% 堆叠) ----
  const typeTotals = typeCount;
  make('cTypeStar', {
    type:'bar',
    data:{ labels:presentIdx.map(function(i){ return TYPES[i]; }),
      datasets:STAR_LABELS.map(function(name,k){
        const si = STAR_BUCKET[k];
        return { label:name, backgroundColor:STAR_COLORS[k], borderWidth:0,
          data:presentIdx.map(function(ti){
            return typeTotals[ti] ? +(typeStar[ti][si]*100/typeTotals[ti]).toFixed(1) : 0; }) };
      })},
    options:{ responsive:true, maintainAspectRatio:false,
      onClick:function(e,els){
        if (!els.length) return;
        const ti = presentIdx[els[0].index], si = STAR_BUCKET[els[0].datasetIndex];
        showList(TYPES[ti] + ' · ' + (si ? si+' 星' : '未评分'),
          function(r){ return r[3] === ti && r[4] === si; });
      },
      scales:{ x:{stacked:true,grid:{display:false},ticks:{maxRotation:60,minRotation:45,font:{size:10}}},
               y:{stacked:true,max:100,ticks:{callback:function(v){return v+'%';}},...GRID} },
      plugins:{ legend:{position:'bottom',labels:{boxWidth:11,boxHeight:11,padding:8}} } }
  });

  // ---- 各类型占比逐年 ----
  const topN = 8;
  const topIdx = presentIdx.slice().sort(function(x,y){ return typeCount[y]-typeCount[x]; }).slice(0,topN);
  const stackColors = topIdx.map(function(ti,k){ return PALETTE[k]; }).concat(['#9b9b9b']);
  const stackLabels = topIdx.map(function(ti){ return TYPES[ti]; }).concat(['其他']);
  const yrTotals = yearType.map(function(arr){ return arr.reduce(function(s,v){return s+v;},0); });
  const stacked = topIdx.map(function(ti){
    return yearType.map(function(arr){ return arr[ti]; });
  });
  stacked.push(yearType.map(function(arr){
    return arr.reduce(function(s,v,i){ return s + (topIdx.indexOf(i)<0 ? v : 0); },0); }));

  make('cYearType', {
    type:'bar',
    data:{ labels:labels, datasets:stacked.map(function(d,i){
      return { label:stackLabels[i], backgroundColor:stackColors[i], borderWidth:0,
        data:d.map(function(v,k){ return yrTotals[k] ? +(v*100/yrTotals[k]).toFixed(1) : 0; }) };
    })},
    options:{ responsive:true, maintainAspectRatio:false,
      onClick:function(e,els){
        if (!els.length) return;
        const y = yrs[els[0].index], di = els[0].datasetIndex;
        if (di < topIdx.length){
          const ti = topIdx[di];
          showList(YEARS[y] + ' 年 · ' + TYPES[ti], function(r){ return r[0] === y && r[3] === ti; });
        } else {
          showList(YEARS[y] + ' 年 · 其他', function(r){ return r[0] === y && topIdx.indexOf(r[3]) < 0; });
        }
      },
      scales:{ x:{stacked:true,grid:{display:false}}, y:{stacked:true,max:100,...GRID,
        ticks:{callback:function(v){return v+'%';}}} },
      plugins:{ legend:{position:'bottom',labels:{boxWidth:11,boxHeight:11,padding:9}} } }
  });

  // ---- 月份 / 星期 ----
  make('cMonth', { type:'bar',
    data:{ labels:MO, datasets:[{ data:byMonth, backgroundColor:'#5e8c61', borderRadius:3 }] },
    options:{ responsive:true, maintainAspectRatio:false,
      onClick:function(e,els){
        if (!els.length) return;
        const mo = els[0].index + 1;
        showList(mo + ' 月', function(r){ return r[1] === mo; });
      },
      plugins:{legend:{display:false}},
      scales:{ y:{beginAtZero:true,...GRID}, x:{grid:{display:false}} } } });

  make('cWeek', { type:'bar',
    data:{ labels:WK, datasets:[{ data:byWeek, backgroundColor:'#8f6aa8', borderRadius:3 }] },
    options:{ responsive:true, maintainAspectRatio:false,
      onClick:function(e,els){
        if (!els.length) return;
        const wd = els[0].index;
        showList(WK[wd], function(r){ return r[2] === wd; });
      },
      plugins:{legend:{display:false}},
      scales:{ y:{beginAtZero:true,...GRID}, x:{grid:{display:false}} } } });
}

// ---------- 脚注 ----------
document.getElementById('foot').innerHTML =
  '数据来自你在豆瓣「我看过的影视」里每一条的标记日期和评分,共 ' + DATA.total + ' 条' +
  (DATA.undated.length ? '(其中《' + DATA.undated.join('》《') + '》没有标记日期,未计入时序图表)' : '') + '。<br>' +
  '评分来自豆瓣的评分字段(★1–★5)。注意 2008 年那次(尤其 2008-10-05 一天补标 159 条)是批量补标,不代表当年的真实观看节奏 —— 想看真实节奏,把时间范围起点调到 2009 年之后。';

setPreset('all');
</script>
</body>
</html>
